<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>制造业数据问答助手</title>
  <style>
    
    :root {
      --primary: #4f46e5;      
      --primary-dark: #4338ca;
      --primary-2: #7c3aed;    
      --bg: #eef1f6;           
      --card: #ffffff;
      --text: #1e293b;
      --muted: #94a3b8;        
      --border: #e2e8f0;
      --green: #047857;
      --green-bg: #d1fae5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 880px;
      height: 100%;
      max-height: 920px;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
      overflow: hidden;
    }

    header {
      padding: 18px 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .logo {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    header .title { font-size: 18px; font-weight: 700; line-height: 1.2; }
    header .subtitle { font-size: 12px; opacity: 0.85; }

    .user-box {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .user-box .who { text-align: right; line-height: 1.25; }
    .user-box .name { font-size: 13px; font-weight: 600; }
    .user-box .role {
      font-size: 11px;
      opacity: 0.85;
      
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 1px 8px;
      display: inline-block;
      margin-top: 2px;
    }
    .user-box .logout {
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-box .logout:hover { background: rgba(255, 255, 255, 0.18); }

    .user-box[hidden] { display: none; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: #f8fafc;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 82%;
      align-items: flex-end;
    }
    .message .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      user-select: none;
    }
    
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.user .avatar { background: var(--primary); }
    .message.assistant { align-self: flex-start; }
    .message.assistant .avatar { background: #eef2ff; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.65;
      font-size: 15px;
      color: var(--text);
      word-break: break-word;
    }
    .message.user .bubble {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border-bottom-right-radius: 4px;  
    }
    .message.assistant .bubble {
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      border-bottom-left-radius: 4px;
    }

    .progress { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .step {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--green-bg);
      color: var(--green);
    }
    .step.pending { background: #fef3c7; color: #b45309; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    .section-title {
      font-size: 12px; color: var(--muted);
      margin: 10px 0 6px; font-weight: 600; letter-spacing: 0.5px;
    }

    .code-block {
      margin-top: 4px; border-radius: 10px; overflow: hidden;
      border: 1px solid #334155;
    }
    .code-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 12px; background: #1e293b;
      color: #94a3b8; font-size: 12px; font-weight: 600; letter-spacing: 1px;
    }
    .copy-btn {
      border: none; background: #334155; color: #e2e8f0;
      padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: #475569; }
    .sql pre {
      background: #0f172a; color: #a5f3fc;
      padding: 12px 14px; overflow-x: auto; font-size: 13px;
      font-family: "Consolas", "Courier New", monospace;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .table-wrap { overflow-x: auto; margin-top: 4px; border-radius: 10px; border: 1px solid var(--border); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; color: #475569; font-weight: 600; font-size: 13px; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8fafc; }

    .empty-result { color: var(--muted); font-size: 14px; padding: 8px 2px; }

    .error-box {
      background: #fee2e2; color: #b91c1c;
      padding: 10px 12px; border-radius: 10px; font-size: 14px;
      border: 1px solid #fecaca;
    }

    .assistant .progress:empty,
    .assistant .sql:empty,
    .assistant .result:empty,
    .assistant .error:empty { display: none; }

    .input-row {
      display: flex; gap: 12px; padding: 16px 20px;
      background: #fff; border-top: 1px solid var(--border);
    }
    #query-input {
      flex: 1; padding: 13px 16px; font-size: 15px;
      border: 2px solid var(--border); border-radius: 12px; outline: none;
      color: var(--text);
      transition: border-color 0.2s;
    }
    #query-input:focus { border-color: var(--primary); }
    #send-btn {
      padding: 0 26px; font-size: 15px; font-weight: 600; border: none;
      border-radius: 12px; background: var(--primary); color: #fff; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    #send-btn:hover { background: var(--primary-dark); }
    #send-btn:active { transform: scale(0.96); }
    #send-btn:disabled { background: #c7d2fe; cursor: not-allowed; }

    @media (max-width: 640px) {
      body { padding: 0; }
      .app { border-radius: 0; max-height: none; }
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 8px 24px 0;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    
    .tabs[hidden] { display: none; }
    .tab {
      padding: 8px 16px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      border-radius: 10px 10px 0 0;
      border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .tab.active {
      color: var(--primary);
      font-weight: 600;
      background: var(--bg);
      border-bottom-color: var(--primary);
    }

    .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .panel[hidden] { display: none; }

    .entry {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 20px 24px;
      background: #f8fafc;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .card h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h3 .muted { font-weight: 400; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .grid.two { grid-template-columns: repeat(2, 1fr); }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 7px 9px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    
    .field.bad input, .field.bad select { border-color: #dc2626; background: #fef2f2; }

    .items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .items-table th {
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      padding: 4px 6px;
    }
    .items-table td { padding: 3px 4px; }
    .items-table input, .items-table select {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
    }
    
    .items-table .amt { color: var(--green); font-weight: 600; padding-left: 6px; }
    .row-del {
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .entry-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .btn {
      border: none;
      border-radius: 9px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.55; cursor: default; }
    .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }

    .notice {
      font-size: 13px;
      line-height: 1.6;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .notice.ok { background: var(--green-bg); color: var(--green); }
    .notice.err { background: #fee2e2; color: #b91c1c; }
    .notice ul { margin: 6px 0 0 20px; }
    .notice[hidden] { display: none; }

    .recent { font-size: 12px; width: 100%; border-collapse: collapse; }
    .recent th, .recent td {
      padding: 5px 6px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    .recent tbody tr { cursor: pointer; }
    .recent tbody tr:hover { background: #f8fafc; }
    .muted { color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">🚿</div>
      <div>
        <div class="title">制造业数据问答助手</div>
        <div class="subtitle">用自然语言问数据，自动生成 SQL 并返回结果</div>
      </div>

      <div class="user-box" id="user-box" hidden>
        <div class="who">
          <div class="name" id="user-name"></div>
          <div class="role" id="user-role"></div>
        </div>
        <button class="logout" id="logout-btn">退出</button>
      </div>
    </header>
    
    <div class="tabs" id="tabs" hidden>
      <button class="tab active" id="tab-query" data-panel="panel-query">问数</button>
      <button class="tab" id="tab-entry" data-panel="panel-entry" hidden>数据录入</button>
    </div>

    <div class="panel" id="panel-query">
      <div id="messages"></div>
      <div class="input-row">
        <input id="query-input" type="text"
               placeholder="输入问题，例如：今年各业务员的中标率是多少？">
        <button id="send-btn">发送</button>
      </div>
    </div>

    <div class="panel entry" id="panel-entry" hidden>
      <div class="notice" id="entry-notice" hidden></div>

      <div class="card">
        <h3>合同头 <span class="muted" id="entry-mode">新增</span></h3>
        <div class="grid">
          <div class="field" data-field="order_id">
            <label>合同号（留空自动生成）</label>
            <input id="f-order-id" type="text" placeholder="留空 = 按业务员单号规则顺延">
          </div>
          <div class="field" data-field="customer_id">
            <label>客户</label>
            <select id="f-customer"></select>
          </div>
          <div class="field" data-field="employee_id">
            <label>业务员（合同负责人）</label>
            <select id="f-employee"></select>
          </div>
          <div class="field" data-field="order_date">
            <label>下单日期</label>
            <input id="f-order-date" type="date">
          </div>
          <div class="field" data-field="ship_date">
            <label>承诺交期</label>
            <input id="f-ship-date" type="date">
          </div>
          <div class="field" data-field="actual_ship_date">
            <label>实际发货日（填了状态自动变「已发货」）</label>
            <input id="f-actual-ship" type="date">
          </div>
          <div class="field" data-field="currency">
            <label>币种</label>
            <select id="f-currency">
              <option value="USD">USD</option>
              <option value="CNY">CNY</option>
            </select>
          </div>
          <div class="field" data-field="order_status">
            <label>状态（没有成品明细时才需要填）</label>
            <select id="f-status">
              <option value="">自动判断</option>
              <option value="生产中">生产中</option>
              <option value="已完工">已完工</option>
            </select>
          </div>
          <div class="field" data-field="delay_reason">
            <label>延期原因（延期了必填）</label>
            <input id="f-delay-reason" type="text" placeholder="例如：客户确认慢">
          </div>
        </div>
      </div>

      <div class="card">
        <h3>产品明细 <span class="muted">金额和只重由服务端按「单价 × 数量」算</span></h3>
        <table class="items-table">
          <thead>
            <tr>
              <th style="width:40%">产品</th>
              <th style="width:16%">数量</th>
              <th style="width:18%">单价</th>
              <th style="width:18%">金额（预览）</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="items-body"></tbody>
        </table>
        <div class="entry-actions">
          <button class="btn btn-ghost" id="add-item">+ 加一行明细</button>
        </div>
      </div>

      <div class="card">
        <h3>生产指令 <span class="muted">不填则按「承诺交期 − 20 天」推算；只有成品建生产指令</span></h3>
        <div class="grid two">
          <div class="field" data-field="production.plan_done_date">
            <label>计划完工日</label>
            <input id="f-plan-done" type="date">
          </div>
          <div class="field" data-field="production.actual_done_date">
            <label>实际完工日</label>
            <input id="f-actual-done" type="date">
          </div>
          <div class="field" data-field="production.delay_reason">
            <label>生产延期原因（生产延期必填）</label>
            <input id="f-prod-reason" type="text">
          </div>
        </div>
      </div>

      <div class="entry-actions">
        <button class="btn btn-primary" id="save-btn">保存合同</button>
        <button class="btn btn-ghost" id="reset-btn">清空表单</button>
        <button class="btn btn-ghost" id="load-recent">刷新最近录入</button>
        <span class="muted" style="font-size:12px" id="save-hint"></span>
      </div>

      <div class="card" style="margin-top:14px">
        <h3>最近录入 / 修改的合同 <span class="muted">点一行把它读进表单来改</span></h3>
        <div style="max-height:220px;overflow:auto">
          <table class="recent">
            <thead>
              <tr><th>合同号</th><th>业务员</th><th>下单</th><th>交期</th><th>状态</th><th>币种</th></tr>
            </thead>
            <tbody id="recent-body">
              <tr><td colspan="6" class="muted">点右上角「刷新最近录入」加载</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>CSV 批量导入 <span class="muted">一行明细一行，同一个合同号出现多行会合并成一份合同</span></h3>
        <div class="entry-actions">
          <input id="csv-file" type="file" accept=".csv,text/csv">
          <button class="btn btn-ghost" id="dry-run-btn">先预检（不落库）</button>
          <button class="btn btn-primary" id="import-btn">确认导入</button>
          <button class="btn btn-ghost" id="template-btn">下载模板</button>
        </div>
        <div class="muted" style="font-size:12px;margin-top:8px">
          首次导入请先点「预检」——它会走**同一套**校验但一行都不写，
          有错的话会一次把每一行的每一处都列出来。
        </div>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('query-input');
    const sendBtn = document.getElementById('send-btn');
    const userBox = document.getElementById('user-box');
    const userNameEl = document.getElementById('user-name');
    const userRoleEl = document.getElementById('user-role');
    const logoutBtn = document.getElementById('logout-btn');

    let currentAssistant = null;
    let pendingEl = null;
    let currentUser = null;

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addUserMessage(text) {
      const el = document.createElement('div');
      el.className = 'message user';
      el.innerHTML = '<div class="avatar">👤</div><div class="bubble"></div>';
      el.querySelector('.bubble').textContent = text;
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    function addAssistantMessage() {
      const wrapper = document.createElement('div');
      wrapper.className = 'message assistant';
      wrapper.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble">
          <div class="progress"></div>
          <div class="sql"></div>
          <div class="result"></div>
          <div class="error"></div>
        </div>
      `;
      messagesEl.appendChild(wrapper);
      scrollToBottom();
      const bubble = wrapper.querySelector('.bubble');
      return {
        progress: bubble.querySelector('.progress'),
        sql: bubble.querySelector('.sql'),
        result: bubble.querySelector('.result'),
        error: bubble.querySelector('.error'),
      };
    }

    function addWelcomeMessage(user) {
      const examples = {
        admin: '今年各业务员的中标率是多少？',
        boss: '今年各业务员的中标率是多少？',
        sales_manager: '我们部门今年的合同金额是多少？',
        salesman: '我今年签了多少单？',
      };
      const scopeNotes = {
        admin: '你可以查看全部数据。',
        boss: '你可以查看全部数据。',
        sales_manager: '你能看到本部门的全部数据。',
        salesman: '你只能看到自己名下的单据。',
      };

      const el = document.createElement('div');
      el.className = 'message assistant';
      el.innerHTML = '<div class="avatar">🤖</div><div class="bubble"></div>';
      el.querySelector('.bubble').innerHTML =
        '你好，<b>' + escapeHtml(user.display_name || user.username) + '</b> 👋' +
        '<br>我是 制造业数据问答助手，直接用中文问我销售与生产数据，我会自动生成 SQL 并返回结果。' +
        '<br><span style="color:#94a3b8;font-size:13px">' +
        escapeHtml(scopeNotes[user.role] || '') +
        '查询会按你的权限自动过滤，并留下记录。</span>' +
        '<br>试试：<b>' + escapeHtml(examples[user.role] || '今年各业务员的中标率是多少？') + '</b>';
      messagesEl.appendChild(el);
    }

    function setPending(show) {
      if (show) {
        pendingEl = document.createElement('div');
        pendingEl.className = 'step pending';
        pendingEl.textContent = '⏳ 处理中…';
        currentAssistant.progress.appendChild(pendingEl);
      } else if (pendingEl) {
        pendingEl.remove();
        pendingEl = null;
      }
      scrollToBottom();
    }

    function addProgressStep(label) {
      const step = document.createElement('div');
      step.className = 'step';
      step.textContent = '✓ ' + label;
      currentAssistant.progress.appendChild(step);
      scrollToBottom();
    }

    function copySql(btn) {
      const code = btn.closest('.code-block').querySelector('code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = '已复制 ✓';
        setTimeout(() => { btn.textContent = '复制'; }, 1500);
      }).catch(() => {
        btn.textContent = '复制失败';
        setTimeout(() => { btn.textContent = '复制'; }, 1500);
      });
    }

    function setSql(sql) {
      currentAssistant.sql.innerHTML =
        '<div class="code-block">' +
          '<div class="code-header"><span>SQL</span>' +
            '<button class="copy-btn" onclick="copySql(this)">复制</button></div>' +
          '<pre><code>' + escapeHtml(sql) + '</code></pre>' +
        '</div>';
      scrollToBottom();
    }

    function renderTable(result) {
      if (!Array.isArray(result) || result.length === 0) {
        return '<div class="empty-result">（查询无结果）</div>';
      }
      const columns = Object.keys(result[0]);
      let html = '<div class="table-wrap"><table><thead><tr>';
      columns.forEach((c) => { html += '<th>' + escapeHtml(String(c)) + '</th>'; });
      html += '</tr></thead><tbody>';
      result.forEach((row) => {
        html += '<tr>';
        columns.forEach((c) => {
          const v = row[c];
          html += '<td>' + escapeHtml(v == null ? '' : String(v)) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      return html;
    }

    function setResult(result) {
      currentAssistant.result.innerHTML =
        '<div class="section-title">查询结果</div>' + renderTable(result);
      scrollToBottom();
    }

    function showError(message) {
      currentAssistant.error.innerHTML =
        '<div class="error-box">⚠️ ' + escapeHtml(message) + '</div>';
      scrollToBottom();
    }

    function handleMessage(msg) {
      switch (msg.type) {
        case 'progress': addProgressStep(msg.label); break;
        case 'sql':      setSql(msg.sql); break;
        case 'result':   setResult(msg.result); break;
        case 'error':    showError(msg.message); break;
        default:         console.warn('未知消息类型：', msg); break;
      }
    }

    async function sendQuery() {
      const query = inputEl.value.trim();
      if (!query) return;

      addUserMessage(query);
      inputEl.value = '';
      currentAssistant = addAssistantMessage();
      setPending(true);
      setSending(true);

      try {
        const response = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query }),
        });

        if (response.status === 401) {
          location.replace('/');
          return;
        }
        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ' ' + response.statusText);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let idx;
          while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const raw = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            const data = raw.replace(/^data:\s*/, '').trim();
            if (!data) continue;
            try {
              handleMessage(JSON.parse(data));
            } catch (err) {
              console.error('SSE 消息解析失败：', raw, err);
            }
          }
        }
      } catch (err) {
        showError('请求失败：' + err.message);
      } finally {
        setPending(false);
        setSending(false);
      }
    }

    function setSending(sending) {
      sendBtn.disabled = sending;
      sendBtn.textContent = sending ? '查询中…' : '发送';
      inputEl.disabled = sending;
    }

    async function loadIdentity() {
      let response;
      try {
        response = await fetch('/api/me');
      } catch (err) {
        location.replace('/');
        return;
      }

      if (!response.ok) {
        location.replace('/');
        return;
      }

      currentUser = await response.json();

      userNameEl.textContent = currentUser.display_name || currentUser.username;
      userRoleEl.textContent = currentUser.role_label;
      userBox.hidden = false;

      if (currentUser.can_write) {
        tabEntry.hidden = false;
        tabsEl.hidden = false;
      }

      addWelcomeMessage(currentUser);
    }

    logoutBtn.addEventListener('click', async () => {
      logoutBtn.disabled = true;
      logoutBtn.textContent = '退出中…';
      try {
        await fetch('/api/logout', { method: 'POST' });
      } catch (err) {
        console.warn('退出请求失败：', err);
      }
      location.replace('/');
    });

    sendBtn.addEventListener('click', sendQuery);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendQuery();
      }
    });

    const tabsEl = document.getElementById('tabs');
    const tabQuery = document.getElementById('tab-query');
    const tabEntry = document.getElementById('tab-entry');
    const panelQuery = document.getElementById('panel-query');
    const panelEntry = document.getElementById('panel-entry');
    const noticeEl = document.getElementById('entry-notice');
    const modeEl = document.getElementById('entry-mode');
    const itemsBody = document.getElementById('items-body');
    const recentBody = document.getElementById('recent-body');
    const saveBtn = document.getElementById('save-btn');
    const saveHint = document.getElementById('save-hint');
    const fOrderId = document.getElementById('f-order-id');
    const fCustomer = document.getElementById('f-customer');
    const fEmployee = document.getElementById('f-employee');
    const fOrderDate = document.getElementById('f-order-date');
    const fShipDate = document.getElementById('f-ship-date');
    const fActualShip = document.getElementById('f-actual-ship');
    const fCurrency = document.getElementById('f-currency');
    const fStatus = document.getElementById('f-status');
    const fDelayReason = document.getElementById('f-delay-reason');
    const fPlanDone = document.getElementById('f-plan-done');
    const fActualDone = document.getElementById('f-actual-done');
    const fProdReason = document.getElementById('f-prod-reason');

    let optionsData = null;
    let editingOrderId = null;

    [tabQuery, tabEntry].forEach((btn) => {
      btn.addEventListener('click', () => {
        [tabQuery, tabEntry].forEach((b) => b.classList.toggle('active', b === btn));
        panelQuery.hidden = btn !== tabQuery;
        panelEntry.hidden = btn !== tabEntry;
        if (btn === tabEntry && !optionsData) loadEntryOptions();
      });
    });

    function showNotice(kind, message, errors) {
      noticeEl.className = 'notice ' + kind;
      noticeEl.innerHTML = '';

      const head = document.createElement('div');
      head.textContent = message;
      noticeEl.appendChild(head);

      document.querySelectorAll('#panel-entry .field.bad')
        .forEach((el) => el.classList.remove('bad'));

      if (errors && errors.length) {
        const ul = document.createElement('ul');
        errors.forEach((e) => {
          const li = document.createElement('li');
          li.textContent = e.field + '：' + e.message;
          ul.appendChild(li);
          document.querySelectorAll('#panel-entry .field').forEach((f) => {
            if (f.dataset.field === e.field) f.classList.add('bad');
          });
          const m = /^items\[(\d+)\]\.(\w+)$/.exec(e.field);
          if (m) {
            const row = itemsBody.children[Number(m[1]) - 1];
            const input = row && row.querySelector('[data-col="' + m[2] + '"]');
            if (input) input.style.borderColor = '#dc2626';
          }
        });
        noticeEl.appendChild(ul);
      }
      noticeEl.hidden = false;
      noticeEl.scrollIntoView({ block: 'nearest' });
    }

    function clearNotice() {
      noticeEl.hidden = true;
      document.querySelectorAll('#panel-entry .field.bad')
        .forEach((el) => el.classList.remove('bad'));
      itemsBody.querySelectorAll('input,select')
        .forEach((el) => { el.style.borderColor = ''; });
    }

    function fillSelect(sel, rows, valueKey, labelKey, placeholder) {
      sel.innerHTML = '';
      if (placeholder) {
        const o = document.createElement('option');
        o.value = '';
        o.textContent = placeholder;
        sel.appendChild(o);
      }
      rows.forEach((r) => {
        const o = document.createElement('option');
        o.value = r[valueKey];
        o.textContent = r[labelKey] + '（' + r[valueKey] + '）';
        sel.appendChild(o);
      });
    }

    async function loadEntryOptions() {
      const res = await fetch('/api/orders/options');
      if (!res.ok) {
        showNotice('err', '加载下拉选项失败（HTTP ' + res.status + '）');
        return;
      }
      optionsData = await res.json();
      fillSelect(fCustomer, optionsData.customers, 'customer_id', 'customer_name');
      fillSelect(fEmployee, optionsData.employees, 'employee_id', 'employee_name');
      renderRows([{ product_id: '', quantity: '', unit_price: '' }]);
      refreshProductLabels();
    }

    function productById(id) {
      return (optionsData.products || []).find((p) => p.product_id === id);
    }

    function refreshProductLabels() {
      const opts = itemsBody.querySelectorAll('[data-col="product_id"]');
      opts.forEach((sel) => {
        Array.from(sel.options).forEach((o) => {
          const p = productById(o.value);
          if (p) o.textContent = p.product_name + '（' + p.product_id + ' · ' + p.product_type + '）';
        });
      });
    }

    function renderRows(rows) {
      itemsBody.innerHTML = '';
      rows.forEach((r) => addRow(r));
      if (!rows.length) addRow({});
      refreshProductLabels();
    }

    function addRow(row) {
      const tr = document.createElement('tr');
      const sel = document.createElement('select');
      sel.dataset.col = 'product_id';
      (optionsData ? optionsData.products : []).forEach((p) => {
        const o = document.createElement('option');
        o.value = p.product_id;
        o.textContent = p.product_name + '（' + p.product_id + ' · ' + p.product_type + '）';
        sel.appendChild(o);
      });
      sel.value = row.product_id || '';

      const qty = document.createElement('input');
      qty.dataset.col = 'quantity';
      qty.type = 'number';
      qty.min = '1';
      qty.value = row.quantity === undefined || row.quantity === null ? '' : row.quantity;

      const price = document.createElement('input');
      price.dataset.col = 'unit_price';
      price.type = 'number';
      price.step = '0.01';
      price.value = row.unit_price === undefined || row.unit_price === null ? '' : row.unit_price;

      const amt = document.createElement('span');
      amt.className = 'amt';
      amt.textContent = '—';

      const del = document.createElement('button');
      del.className = 'row-del';
      del.textContent = '删';
      del.addEventListener('click', () => {
        tr.remove();
        if (!itemsBody.children.length) addRow({});
      });

      function recalc() {
        const q = parseFloat(qty.value);
        const p = parseFloat(price.value);
        amt.textContent = (isFinite(q) && isFinite(p)) ? (q * p).toFixed(2) : '—';
      }
      qty.addEventListener('input', recalc);
      price.addEventListener('input', recalc);
      recalc();

      const tdSel = document.createElement('td'); tdSel.appendChild(sel);
      const tdQty = document.createElement('td'); tdQty.appendChild(qty);
      const tdPrice = document.createElement('td'); tdPrice.appendChild(price);
      const tdAmt = document.createElement('td'); tdAmt.appendChild(amt);
      const tdDel = document.createElement('td'); tdDel.appendChild(del);
      tr.append(tdSel, tdQty, tdPrice, tdAmt, tdDel);
      itemsBody.appendChild(tr);
    }

    function collectPayload() {
      const items = Array.from(itemsBody.children).map((tr) => ({
        product_id: tr.querySelector('[data-col="product_id"]').value,
        quantity: tr.querySelector('[data-col="quantity"]').value,
        unit_price: tr.querySelector('[data-col="unit_price"]').value,
      })).filter((i) => i.product_id);

      const production = {};
      if (fPlanDone.value) production.plan_done_date = fPlanDone.value;
      if (fActualDone.value) production.actual_done_date = fActualDone.value;
      if (fProdReason.value) production.delay_reason = fProdReason.value;

      return {
        order_id: fOrderId.value.trim() || null,
        customer_id: fCustomer.value,
        employee_id: fEmployee.value,
        order_date: fOrderDate.value || null,
        ship_date: fShipDate.value || null,
        actual_ship_date: fActualShip.value || null,
        currency: fCurrency.value,
        order_status: fStatus.value || null,
        delay_reason: fDelayReason.value.trim() || null,
        items: items,
        production: Object.keys(production).length ? production : null,
      };
    }

    function resetForm() {
      editingOrderId = null;
      modeEl.textContent = '新增';
      saveBtn.textContent = '保存合同';
      saveHint.textContent = '';
      [fOrderId, fOrderDate, fShipDate, fActualShip, fDelayReason,
        fPlanDone, fActualDone, fProdReason].forEach((el) => { el.value = ''; });
      fStatus.value = '';
      fOrderId.disabled = false;
      clearNotice();
      if (optionsData) renderRows([{}]);
    }

    async function saveOrder() {
      clearNotice();
      const payload = collectPayload();
      if (!payload.items.length) {
        showNotice('err', '至少要有一行产品明细');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = '保存中…';
      try {
        const url = editingOrderId ? '/api/orders/' + encodeURIComponent(editingOrderId)
                                   : '/api/orders';
        const res = await fetch(url, {
          method: editingOrderId ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => null);

        if (res.status === 401) { location.replace('/'); return; }
        if (res.status === 403) {
          showNotice('err', '当前角色没有数据录入权限');
          return;
        }
        if (res.status === 422) {
          const detail = (data && data.detail) || {};
          showNotice('err', detail.message || '数据没通过校验，一条都没有写入',
                     detail.errors);
          return;
        }
        if (!res.ok) {
          showNotice('err', '保存失败（HTTP ' + res.status + '）');
          return;
        }

        const verb = data.action === 'update' ? '已修改' : '已新增';
        showNotice('ok',
          verb + '合同 ' + data.order_id + '：' + data.items + ' 行明细、'
          + data.production + ' 张生产指令、' + data.processes + ' 行工序，'
          + '合同分档「' + data.contract_type + '」，状态「' + data.order_status + '」。'
          + '现在去「问数」页签问它，就能查到了。');
        editingOrderId = data.order_id;
        fOrderId.value = data.order_id;
        fOrderId.disabled = true;
        modeEl.textContent = '修改 ' + data.order_id;
        saveBtn.textContent = '保存修改';
        loadRecent();
      } catch (err) {
        showNotice('err', '保存失败：' + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function loadOrder(orderId) {
      clearNotice();
      const res = await fetch('/api/orders/' + encodeURIComponent(orderId));
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        showNotice('err', '读取失败：' + ((data && data.detail) || res.status));
        return;
      }
      const o = data.order;
      const iso = (id) => {
        if (!id) return '';
        const s = String(id);
        return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8);
      };

      fOrderId.value = o.order_id;
      fOrderId.disabled = true;
      fCustomer.value = o.customer_id;
      fEmployee.value = o.employee_id;
      fOrderDate.value = iso(o.order_date_id);
      fShipDate.value = iso(o.ship_date_id);
      fActualShip.value = iso(o.actual_ship_date_id);
      fCurrency.value = o.currency;
      fStatus.value = (o.order_status === '生产中' || o.order_status === '已完工')
        ? o.order_status : '';
      fDelayReason.value = o.delay_reason || '';

      const prod = (data.production || [])[0] || {};
      fPlanDone.value = iso(prod.plan_done_date_id);
      fActualDone.value = iso(prod.actual_done_date_id);
      fProdReason.value = prod.delay_reason || '';

      const rows = (data.items || []).map((it) => ({
        product_id: it.product_id,
        quantity: it.quantity,
        unit_price: '',
      }));
      renderRows(rows.length ? rows : [{}]);
      if (rows.length) {
        showNotice('err', '注意：库里只存了明细的**金额**，不存单价，所以单价要重填。'
          + '（下面金额预览会显示「—」，填上单价即可）');
      }

      editingOrderId = o.order_id;
      modeEl.textContent = '修改 ' + o.order_id;
      saveBtn.textContent = '保存修改';
      document.getElementById('entry-notice').scrollIntoView({ block: 'nearest' });
    }

    async function loadRecent() {
      const res = await fetch('/api/orders?limit=30');
      if (!res.ok) return;
      const data = await res.json();
      recentBody.innerHTML = '';
      if (!data.orders.length) {
        recentBody.innerHTML = '<tr><td colspan="6" class="muted">还没有录入过合同</td></tr>';
        return;
      }
      data.orders.forEach((o) => {
        const tr = document.createElement('tr');
        const iso = (id) => id ? (String(id).slice(0, 4) + '-' + String(id).slice(4, 6)
          + '-' + String(id).slice(6, 8)) : '—';
        [o.order_id, o.employee_id, iso(o.order_date_id), iso(o.ship_date_id),
          o.order_status, o.currency].forEach((v) => {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        });
        tr.addEventListener('click', () => loadOrder(o.order_id));
        recentBody.appendChild(tr);
      });
    }

    async function submitCsv(dryRun) {
      const file = document.getElementById('csv-file').files[0];
      if (!file) {
        showNotice('err', '先选一个 CSV 文件');
        return;
      }
      clearNotice();
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/api/orders/import' + (dryRun ? '?dry_run=true' : ''),
        { method: 'POST', body: fd });
      const data = await res.json().catch(() => null);
      if (res.status === 403) { showNotice('err', '当前角色没有数据录入权限'); return; }
      if (res.status === 422) {
        const detail = (data && data.detail) || {};
        showNotice('err', detail.message || 'CSV 没通过校验', detail.errors);
        return;
      }
      if (!res.ok) { showNotice('err', '导入失败（HTTP ' + res.status + '）'); return; }

      const lines = data.results.map((r) =>
        r.order_id + '（' + r.items + ' 行明细 / ' + r.production + ' 张生产指令）');
      showNotice('ok',
        (dryRun ? '预检通过，一行都没落库：' : '导入成功：') + data.orders + ' 份合同 —— '
        + lines.join('；'));
      if (!dryRun) loadRecent();
    }

    document.getElementById('add-item').addEventListener('click', () => addRow({}));
    document.getElementById('reset-btn').addEventListener('click', resetForm);
    document.getElementById('load-recent').addEventListener('click', loadRecent);
    saveBtn.addEventListener('click', saveOrder);
    document.getElementById('dry-run-btn')
      .addEventListener('click', () => submitCsv(true));
    document.getElementById('import-btn')
      .addEventListener('click', () => submitCsv(false));
    document.getElementById('template-btn').addEventListener('click', async () => {
      const res = await fetch('/api/orders/csv-template');
      if (!res.ok) { showNotice('err', '下载模板失败'); return; }
      const data = await res.json();
      const blob = new Blob(['﻿' + data.content],
        { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = data.filename;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
